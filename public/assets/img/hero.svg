<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Panel de control de identidad digital con escudo de seguridad">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1430"/>
      <stop offset="1" stop-color="#111a3a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2547"/>
      <stop offset="1" stop-color="#131c39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9bff"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f9bff"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="150" fill="#4f9bff" opacity="0.08"/>
  <circle cx="180" cy="540" r="170" fill="#2563eb" opacity="0.10"/>

  <!-- dashboard panel -->
  <g>
    <rect x="90" y="90" width="700" height="460" rx="18" fill="url(#panel)" stroke="#22305a"/>
    <rect x="90" y="90" width="700" height="46" rx="18" fill="#1b2748"/>
    <rect x="90" y="118" width="700" height="18" fill="#1b2748"/>
    <circle cx="120" cy="113" r="6" fill="#ff5f57"/>
    <circle cx="142" cy="113" r="6" fill="#febc2e"/>
    <circle cx="164" cy="113" r="6" fill="#28c840"/>
    <rect x="200" y="104" width="180" height="18" rx="9" fill="#0f1730"/>

    <!-- sidebar -->
    <rect x="114" y="160" width="180" height="366" rx="12" fill="#0f1730"/>
    <rect x="132" y="184" width="120" height="14" rx="7" fill="#2b3a68"/>
    <rect x="132" y="216" width="144" height="12" rx="6" fill="#4f9bff" opacity="0.85"/>
    <rect x="132" y="244" width="144" height="12" rx="6" fill="#2b3a68"/>
    <rect x="132" y="272" width="144" height="12" rx="6" fill="#2b3a68"/>
    <rect x="132" y="300" width="144" height="12" rx="6" fill="#2b3a68"/>
    <rect x="132" y="328" width="144" height="12" rx="6" fill="#2b3a68"/>

    <!-- rows (users) -->
    <g>
      <rect x="318" y="168" width="440" height="64" rx="12" fill="#0f1730"/>
      <circle cx="350" cy="200" r="18" fill="url(#accent)"/>
      <circle cx="350" cy="194" r="6" fill="#0b1020"/>
      <path d="M339 210 a11 11 0 0 1 22 0" fill="#0b1020"/>
      <rect x="382" y="184" width="150" height="12" rx="6" fill="#3a4a7a"/>
      <rect x="382" y="204" width="100" height="10" rx="5" fill="#26335c"/>
      <rect x="660" y="188" width="80" height="26" rx="13" fill="#14351f"/>
      <rect x="672" y="197" width="56" height="8" rx="4" fill="#28c840"/>
    </g>
    <g>
      <rect x="318" y="248" width="440" height="64" rx="12" fill="#0f1730"/>
      <circle cx="350" cy="280" r="18" fill="#6d7bd6"/>
      <circle cx="350" cy="274" r="6" fill="#0b1020"/>
      <path d="M339 290 a11 11 0 0 1 22 0" fill="#0b1020"/>
      <rect x="382" y="264" width="170" height="12" rx="6" fill="#3a4a7a"/>
      <rect x="382" y="284" width="90" height="10" rx="5" fill="#26335c"/>
      <rect x="660" y="268" width="80" height="26" rx="13" fill="#3a2b0f"/>
      <rect x="672" y="277" width="56" height="8" rx="4" fill="#febc2e"/>
    </g>
    <g>
      <rect x="318" y="328" width="440" height="64" rx="12" fill="#0f1730"/>
      <circle cx="350" cy="360" r="18" fill="#3fb6a8"/>
      <circle cx="350" cy="354" r="6" fill="#0b1020"/>
      <path d="M339 370 a11 11 0 0 1 22 0" fill="#0b1020"/>
      <rect x="382" y="344" width="130" height="12" rx="6" fill="#3a4a7a"/>
      <rect x="382" y="364" width="110" height="10" rx="5" fill="#26335c"/>
      <rect x="660" y="272" width="80" height="26" rx="13" fill="#3a2436"/>
      <rect x="672" y="281" width="56" height="8" rx="4" fill="#ff5f57"/>
    </g>
  </g>

  <!-- shield badge -->
  <g transform="translate(760 120)">
    <path d="M120 8 L214 46 V150 C214 224 168 282 120 306 C72 282 26 224 26 150 V46 Z" fill="url(#shield)"/>
    <path d="M120 8 L214 46 V150 C214 224 168 282 120 306 C72 282 26 150 120 306 Z" fill="#000" opacity="0"/>
    <path d="M86 150 l24 26 l48 -58" fill="none" stroke="#eaf1ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating card -->
  <g transform="translate(690 470)">
    <rect width="360" height="110" rx="16" fill="#0f1730" stroke="#22305a"/>
    <rect x="24" y="26" width="120" height="12" rx="6" fill="#3a4a7a"/>
    <rect x="24" y="50" width="180" height="10" rx="5" fill="#26335c"/>
    <rect x="24" y="84" width="300" height="14" rx="7" fill="#0b1020"/>
    <rect x="24" y="84" width="210" height="14" rx="7" fill="url(#accent)"/>
  </g>
</svg>
